name: Diagnose Secrets

on:
  workflow_dispatch:

jobs:
  diagnose:
    name: Test Secret Access
    runs-on: ubuntu-latest
    steps:
      - name: Check COPILOT_PAT availability
        env:
          TOKEN: ${{ secrets.COPILOT_PAT }}
        run: |
          echo "===== COPILOT_PAT ====="
          if [ -z "$TOKEN" ]; then
            echo "::error::COPILOT_PAT is EMPTY or NOT SET"
            echo "copilot_pat_set=false" >> "$GITHUB_OUTPUT"
          else
            echo "COPILOT_PAT is set (length: ${#TOKEN} chars)"
            echo "copilot_pat_set=true" >> "$GITHUB_OUTPUT"
          fi
        id: check-pat

      - name: Check APPROVER_PAT availability
        env:
          TOKEN: ${{ secrets.APPROVER_PAT }}
        run: |
          echo "===== APPROVER_PAT ====="
          if [ -z "$TOKEN" ]; then
            echo "::warning::APPROVER_PAT is EMPTY or NOT SET"
          else
            echo "APPROVER_PAT is set (length: ${#TOKEN} chars)"
          fi

      - name: Check GITHUB_TOKEN (default)
        env:
          TOKEN: ${{ github.token }}
        run: |
          echo "===== GITHUB_TOKEN (default) ====="
          if [ -z "$TOKEN" ]; then
            echo "::error::GITHUB_TOKEN is EMPTY"
          else
            echo "GITHUB_TOKEN is set (length: ${#TOKEN} chars)"
          fi

      - name: Test gh auth with COPILOT_PAT
        if: steps.check-pat.outputs.copilot_pat_set == 'true'
        env:
          GH_TOKEN: ${{ secrets.COPILOT_PAT }}
        run: |
          echo "===== gh auth status ====="
          gh auth status || echo "::error::gh auth failed with COPILOT_PAT"

      - name: Test repo read access with COPILOT_PAT
        if: steps.check-pat.outputs.copilot_pat_set == 'true'
        env:
          GH_TOKEN: ${{ secrets.COPILOT_PAT }}
        run: |
          echo "===== Repo read access ====="
          gh api "repos/${{ github.repository }}" --jq '.full_name' \
            && echo "Read access: OK" \
            || echo "::error::Read access FAILED — PAT cannot access this repository"

      - name: Test repo write access with COPILOT_PAT
        if: steps.check-pat.outputs.copilot_pat_set == 'true'
        env:
          GH_TOKEN: ${{ secrets.COPILOT_PAT }}
        run: |
          echo "===== Repo write access (contents) ====="
          # Try creating and immediately deleting a lightweight tag
          TAG_NAME="_diagnose-secrets-test-$(date +%s)"
          gh api "repos/${{ github.repository }}/git/refs" \
            --method POST \
            --field "ref=refs/tags/$TAG_NAME" \
            --field "sha=${{ github.sha }}" \
            && echo "Write access (create tag): OK" \
            || { echo "::error::Write access FAILED — PAT cannot write to this repository"; exit 0; }
          # Clean up
          gh api "repos/${{ github.repository }}/git/refs/tags/$TAG_NAME" \
            --method DELETE \
            && echo "Cleanup (delete tag): OK" \
            || echo "::warning::Could not delete test tag $TAG_NAME"

      - name: Test gh auth with default GITHUB_TOKEN
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "===== gh auth status (GITHUB_TOKEN) ====="
          gh auth status || echo "::error::gh auth failed with GITHUB_TOKEN"

      - name: Test git clone with COPILOT_PAT
        if: steps.check-pat.outputs.copilot_pat_set == 'true'
        env:
          TOKEN: ${{ secrets.COPILOT_PAT }}
        run: |
          echo "===== git ls-remote with COPILOT_PAT ====="
          git ls-remote --heads "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" \
            | head -5 \
            && echo "git read via COPILOT_PAT: OK" \
            || echo "::error::git read via COPILOT_PAT FAILED"

      - name: Summary
        if: always()
        run: |
          echo ""
          echo "============================================"
          echo "  DIAGNOSIS COMPLETE"
          echo "============================================"
          echo ""
          echo "If COPILOT_PAT is empty: the secret is not configured as a Repository Secret."
          echo "  → Go to Settings > Secrets and variables > Actions > Repository secrets"
          echo ""
          echo "If COPILOT_PAT is set but gh auth fails: the PAT is expired or revoked."
          echo "  → Regenerate the PAT and update the secret"
          echo ""
          echo "If gh auth works but repo access fails: the Fine-grained PAT does not"
          echo "  include this repository in its 'Repository access' scope."
          echo "  → Edit the PAT and add this repo under 'Only select repositories'"
          echo ""
          echo "If read works but write fails: the PAT lacks Contents write permission."
          echo "  → Edit the PAT and grant 'Contents: Read and write'"
